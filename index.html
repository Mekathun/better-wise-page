<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Better WiSE Page</title>
<meta name="description" content="Better WiSE Page — a browser extension that improves the WiSE learning platform." />
<style>
  :root{--ink:#1b1220;--muted:#6c5a74;--purple:#64346f;--bg:#faf7fb;--line:#e7dced}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font:16px/1.7 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:32px
  }
  main{max-width:560px;width:100%}
  h1{font-size:28px;margin:0 0 6px;letter-spacing:-.01em}
  p{margin:0 0 18px;color:var(--muted)}
  .links{display:flex;flex-wrap:wrap;gap:12px}
  a.btn{
    display:inline-block;padding:11px 18px;border-radius:999px;text-decoration:none;
    border:1px solid var(--line);background:#fff;color:var(--purple);font-weight:600;font-size:15px
  }
  a.btn:hover{border-color:var(--purple)}
  footer{margin-top:32px;font-size:13px;color:var(--muted)}
  @media (prefers-color-scheme: dark){
    :root{--ink:#f2ecf5;--muted:#a99bb2;--bg:#171019;--line:#3a2c40}
    a.btn{background:#221722;color:#d9b3e6}
  }
</style>
</head>
<body>
<main>
  <h1>Better WiSE Page</h1>
  <p>Next class, AI task cards and an expandable timetable for Wesley College WiSE.</p>
  <div class="links">
    <a class="btn" href="./privacy.html">Privacy policy</a>
  </div>
  <footer>Not an official Wesley College product.</footer>
</main>
</body>
</html>
